name: Typecheck

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

env:
  # yarn.lock is a Yarn 4 lockfile; package.json has no packageManager field, so the version is pinned here
  YARN_VERSION: 4.9.2

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack yarn@$YARN_VERSION install --immutable

      - name: Typecheck
        run: corepack yarn@$YARN_VERSION typecheck
